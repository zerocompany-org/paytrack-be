# Chép thành secret.yaml rồi điền:
#
#     cp secret.example.yaml secret.yaml
#
# VÌ SAO CẢ CẤU HÌNH NẰM TRONG MỘT SECRET (không tách ConfigMap + Secret như các
# service khác): mgmtngd KHÔNG đọc biến môi trường. cmd/mgmtngd/config.go chỉ
# `os.ReadFile` rồi `yaml.Unmarshal` — không có bước expand `${VAR}`. File
# config.production.yaml ở gốc repo viết `${DB_HOST:-localhost}` nhưng chuỗi đó
# được nạp NGUYÊN VĂN vào cấu hình, KHÔNG được thay thế. Nghĩa là mọi giá trị
# phải là giá trị cuối cùng, và vì file có mật khẩu DB + 2 khoá bí mật + mật khẩu
# mail nên nguyên file thuộc về Secret.
#
# Secret này được mount thành FILE /app/private/config.yaml (xem deployment.yaml),
# đúng đường dẫn mà Dockerfile truyền: `./mgmtngd --config=./private/config.yaml`.
#
# stringData: kubectl tự base64 lúc apply. Base64 KHÔNG phải mã hoá — Secret chỉ
# được bảo vệ bằng RBAC và encryption-at-rest của cụm.
#
# App đọc file này ĐÚNG MỘT LẦN lúc khởi động. Sửa Secret xong phải:
#     kubectl -n paytrack rollout restart deployment/paytrack-be
#
# Đây là cấu hình PRODUCTION (hệ chỉ có một môi trường). Sau khi điền, cất bản sao
# aesSecretKey ở nơi an toàn — mất khoá là mất dữ liệu đã mã hoá trong DB.
apiVersion: v1
kind: Secret
metadata:
  name: paytrack-be-secret
  labels:
    app: paytrack-be
type: Opaque
stringData:
  config.yaml: |
    # ---------------------------------------------------------------------
    # Postgres. Chuỗi DSN kiểu key=value của pgx/gorm, KHÔNG phải URL.
    #
    # Cụm đã có Postgres HA dùng chung (Patroni 3 node pg-01/pg-02/pg-03, đứng
    # trước là HAProxy chạy trong cụm ở namespace zcorp-db):
    #   postgres-ha.zcorp-db.svc.cluster.local:5432  -> leader, ĐỌC-GHI  <- dùng cái này
    #   postgres-ha.zcorp-db.svc.cluster.local:5433  -> replica, chỉ đọc
    # HAProxy check Patroni `/primary` nên leader đổi lúc failover thì DSN KHÔNG
    # phải sửa. Trỏ Service, đừng trỏ IP pod/IP VM.
    #
    # Nối THẲNG postgres-ha, KHÔNG qua pgbouncer: zpayment và zauto đều đã chuyển
    # sang nối thẳng, pgbouncer (zcorp-db) vẫn chạy nhưng không còn là đường mặc
    # định. sslmode=disable vì nằm trong mạng nội bộ và Postgres chưa bật ssl.
    #
    # DATABASE + USER PHẢI ĐƯỢC TẠO TRƯỚC — xem mục "Postgres" trong README.
    # App KHÔNG tự tạo database: NewStorage() chỉ gorm.Open rồi autoMigrate().
    # autoMigrate() chạy NGAY lúc boot, trước khi mở cổng HTTP, nên user DB phải
    # có quyền CREATE/ALTER TABLE — thiếu là pod chết ngay ở bước này.
    db:
      dns: "host=postgres-ha.zcorp-db.svc.cluster.local user=paytrack_app password=TODO dbname=paytrack port=5432 sslmode=disable TimeZone=Asia/Ho_Chi_Minh"

    webServer:
      # Phải khớp containerPort/targetPort trong deployment.yaml + service.yaml.
      port: 6789

      # Ký JWT phiên đăng nhập (webserver.go bắt buộc khác rỗng, không có thì pod
      # thoát ngay với "please set up hmacSecretKey").
      # Sinh khoá: openssl rand -hex 32
      # Đổi khoá = mọi phiên bị đá ra ngay lập tức.
      hmacSecretKey: "TODO"

      # Tuổi phiên đăng nhập (giờ). Phải > 0, không thì pod thoát khi khởi động.
      aliveSessionHours: 24

      # Mã hoá AES dữ liệu nhạy cảm lưu trong DB (utils.NewCryptography).
      # KHÓA KHÁC với hmacSecretKey, đừng dán trùng. openssl rand -hex 32
      # MẤT KHÓA = KHÔNG GIẢI MÃ ĐƯỢC dữ liệu đã lưu. Sao lưu cùng chỗ với backup DB.
      aesSecretKey: "TODO"

      # Domain web FE, được nhúng vào link trong email thông báo payment
      # (api_payment.go:102). Sai thì mail gửi đi trỏ nhầm chỗ mà app không báo lỗi.
      clientAddr: "https://paytrack.zerornd.com"

      service:
        # Sàn dùng để quy đổi tỷ giá coin: "binance" | "bittrex" | "coinmarketcap".
        # "coinmarketcap" bắt buộc có coimarketcapKey.
        exchange: "binance"
        allowexchanges: "binance,kucoin,mexc"
        coimarketcapKey: ""

        # authType 0 = username/password nội bộ. 1 = auth microservice ngoài
        # (passkey) qua gRPC tới authHost. Để 0 nếu chưa dựng service đó —
        # authHost khi đó bị bỏ qua (gRPC dial là lazy, sai host cũng không chết
        # lúc boot, chỉ lỗi lúc đăng nhập passkey).
        authType: 0
        authHost: ""

    # "trace" | "debug" | "info" | "warn" | "error" | "off"
    logLevel: "info"

    # BẮT BUỘC trỏ vào thư mục GHI ĐƯỢC. rootfs của pod là read-only, nên
    # deployment.yaml mount emptyDir đúng vào /app/logs. Đổi giá trị này mà không
    # đổi mount thì pod chết ở "failed to init logRotator".
    # Log vẫn ra stdout song song (log/log.go ghi cả hai) nên `kubectl logs` vẫn đủ dùng.
    logDir: "/app/logs"

    # Mail SMTP. Bỏ trống userName/password thì client vẫn khởi tạo được nhưng
    # mọi email thông báo sẽ lỗi lúc gửi.
    # Gmail: password là App Password (myaccount.google.com/security), không phải
    # mật khẩu đăng nhập.
    mail:
      addr: smtp.gmail.com:587
      userName: ""
      password: ""
      host: smtp.gmail.com
      from: "noreply@paytrack.pro"
